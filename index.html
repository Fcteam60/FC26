<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC 26 Grup Ligi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f8f5b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FC26 Lig">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201b;--mut:#66756e;--ac:#0f9d6b;--acx:#fff;--bd:#dde4e0;--hi:#e3f5ec;--wr:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#17211c;--tx:#e8f0ec;--mut:#8a9c94;--ac:#2fd49a;--acx:#06251a;--bd:#263630;--hi:#16352a;--wr:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#17211c;--tx:#e8f0ec;--mut:#8a9c94;--ac:#2fd49a;--acx:#06251a;--bd:#263630;--hi:#16352a;--wr:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
h1{font-size:17px;margin:0;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.chip,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
.tabs button{flex:1 1 auto;white-space:nowrap}
.on{background:var(--ac)!important;color:var(--acx)!important;border-color:var(--ac)!important;font-weight:600}
main{padding:12px;max-width:720px;margin:0 auto}
.grid{display:grid;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{color:var(--mut);font-weight:400;font-size:12px}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{color:var(--mut);font-size:12px;width:30px}
.g{background:var(--hi);color:var(--tx);border-radius:7px;padding:1px 7px;font-weight:700;font-size:13px}
.empty{color:var(--mut);opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{background:var(--hi);border-radius:14px;padding:14px;text-align:center;margin-bottom:10px;min-height:76px}
.big b{font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{padding:6px 12px;flex:0 0 auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 4px;text-align:center}
th{color:var(--mut);font-weight:500}
td:nth-child(2),th:nth-child(2){text-align:left;white-space:nowrap}
tr.q td{background:var(--hi)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--bd)}
.m span:first-child{text-align:right}
.m input{width:34px;text-align:center;font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:7px;padding:4px 0}
.sc{display:flex;gap:4px;align-items:center}
.rt{color:var(--mut);font-size:12px;margin:10px 0 2px}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.sel{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px;flex:1;min-width:0}.f{display:block;width:100%;margin:6px 0;font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px}.rs{display:inline-block;background:var(--hi);border-radius:8px;padding:2px 10px;font-weight:600;margin:4px 0}
.mb{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:16px;line-height:1;padding:0;cursor:pointer}.ct{display:flex;align-items:center;gap:6px}.ct b{min-width:18px;text-align:center}.lb{color:var(--mut);font-size:12px}.pc{padding:8px 0;border-top:1px solid var(--bd)}.pt{display:flex;align-items:center;justify-content:space-between;gap:8px}.pt .n{flex:1;min-width:0;font-weight:600}.cs{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap}.bk{flex:1;height:10px;background:var(--hi);border-radius:5px;overflow:hidden}.bk i{display:block;height:100%;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;font-weight:600}.opt small{display:block;color:var(--mut);font-weight:400;margin-top:2px}.opt.sl{border-color:var(--ac);background:var(--hi)}.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.dbox{background:var(--card);color:var(--tx);border-radius:14px;padding:16px;max-width:340px;width:100%}.dbox .bar{margin:14px 0 0}
.tin{width:46px;text-align:center;font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:5px 0;margin-left:4px}.bdg{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:4px 10px;margin:3px;font-size:13px;opacity:.45}.bdg.un{opacity:1;background:var(--hi);border-color:var(--ac)}.cmp{display:flex;gap:8px;margin-bottom:6px}.tabs button{font-size:12px;padding:8px 6px}textarea.f{resize:vertical}@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}.pop{animation:pop .3s ease-out}
.cup{border:1px solid #d4a017;background:var(--hi);border-radius:12px;padding:10px 12px;margin:8px 0}.cupt{display:flex;justify-content:space-between;align-items:baseline;color:#b8860b;font-weight:600;margin-bottom:2px}.cupt small{color:var(--mut);font-weight:400}
/* kurulum */
.cw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.cw .chip{padding:6px 10px;font-size:13px}
.rr{display:flex;align-items:center;gap:8px;margin:7px 0}
.rr .lb{flex:1;font-size:13px}
.rr .sel{flex:0 0 auto;min-width:112px;padding:6px 8px}
.sh{font-weight:600;font-size:13px;margin:12px 0 2px}
.sh:first-child{margin-top:0}
.wr{color:var(--wr);font-weight:600}
.gd{color:var(--ac);font-weight:600}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.pg .row{padding:4px 0}
.step{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:12px;font-weight:700;margin-right:6px}
/* 1a: alt gezinme, büyük dokunma alanları, geri al */
header .bar{margin:0;flex:1;flex-wrap:nowrap;min-width:0;justify-content:flex-end}
header .sel{padding:8px 6px}
.btn,.sel,.f,.chip{min-height:44px}
.cw .chip{padding:8px 12px}
.rr .sel{padding:8px}
.mb{width:44px;height:44px;font-size:20px}
.ct{gap:4px}
.tin{width:54px;height:44px}
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-width:0;min-height:58px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.cur{color:var(--ac);font-weight:600}
.nav button.cur::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:15;max-width:696px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tx);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;animation:pop .2s ease-out}
.toast[hidden]{display:none}
.toast .btn{background:transparent;color:var(--bg);border-color:var(--bg);font-weight:600;min-height:40px}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.tpl .chip{text-align:left;line-height:1.25;padding:8px 12px}
.tpl .chip small{display:block;opacity:.75;font-weight:400}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 1b: taktik tahtası */
:root{--num:"FC Sayi","Barlow Condensed","Oswald","Bahnschrift","Avenir Next Condensed","Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;--h1:#2f8f5b;--h2:#36a066;--hi2:#d9f0e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--h1:#1d5a3b;--h2:#226847;--hi2:#133026}}
:root[data-theme="dark"]{--h1:#1d5a3b;--h2:#226847;--hi2:#133026}
body::before{background:var(--h1)}
header{background:repeating-linear-gradient(90deg,var(--h1) 0 30px,var(--h2) 30px 60px);border-bottom:0;box-shadow:inset 0 -3px 0 rgba(255,255,255,.8);padding-bottom:11px}
h1{color:#fff;font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:.02em}
.card h3,.step,.row b,.ct b,.big b,.tin,.rs{font-family:var(--num);font-variant-numeric:tabular-nums}
.card h3{font-size:17px;font-weight:700;letter-spacing:.01em}
.big{background:repeating-linear-gradient(90deg,var(--hi) 0 24px,var(--hi2) 24px 48px)}
.fg{width:22px;height:15px;border-radius:2px;vertical-align:-3px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.cc{width:28px}
.g{font-family:var(--num);font-size:16px;min-width:34px;text-align:center;padding:0 7px;line-height:1.5;font-variant-numeric:tabular-nums}
.g.t1{background:linear-gradient(135deg,#f8e08a,#d4a017);color:#3b2a00}
.g.t2{background:linear-gradient(135deg,#eef2f5,#aab5be);color:#1d252b}
.g.t3{background:linear-gradient(135deg,#eab98a,#b0703a);color:#2a1500}
.tc{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px;margin-bottom:10px}
.tc::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 82% 38%,transparent 34px,rgba(0,0,0,.09) 35px,rgba(0,0,0,.09) 37px,transparent 38px),linear-gradient(90deg,transparent calc(82% - 1px),rgba(0,0,0,.07) calc(82% - 1px),rgba(0,0,0,.07) calc(82% + 1px),transparent calc(82% + 1px))}
.tc>*{position:relative}
.tc.t1{background:linear-gradient(150deg,#fbeaa8,#e0b43a);color:#2b2000;border-color:#c99a1c}
.tc.t2{background:linear-gradient(150deg,#f3f6f8,#b9c3cb);color:#1b2328;border-color:#98a4ad}
.tc.t3{background:linear-gradient(150deg,#f0c9a2,#be7f47);color:#2a1500;border-color:#a56a37}
.tch{display:flex;align-items:center;gap:12px}
.ovr{font-family:var(--num);line-height:.9;text-align:center;min-width:56px}
.ovr b{display:block;font-size:52px;font-weight:700}
.ovr span{font-size:12px;font-weight:600;opacity:.75}
.crest{width:46px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--num);font-weight:700;font-size:19px;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:6px;flex:0 0 auto;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.tci{min-width:0}
.tcn{font-family:var(--num);font-size:24px;font-weight:700;line-height:1.1}
.tcc{font-size:13px;opacity:.85;margin-top:2px}
.tcb{margin-top:10px}
.tb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.tb span:first-child{width:62px}
.tb i{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.14);overflow:hidden;font-style:normal}
.tb i u{display:block;height:100%;background:currentColor;border-radius:4px;text-decoration:none}
.tb b{font-family:var(--num);font-size:16px;width:24px;text-align:right}
.tcg{margin-top:8px;font-size:12px;opacity:.85}
/* 1c: kura gösterisi */
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:8;background:var(--bg);padding-bottom:2px}
.dock .big{position:relative;overflow:hidden;min-height:0;padding:8px 12px;margin-bottom:8px}
.dock .bar{margin-bottom:8px}
.rv{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
.rn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.2;animation:revin .7s both}
.rn b{font-size:24px}
.rn .gd{font-size:15px}
.ball{width:36px;height:36px;border-radius:50%;flex:0 0 auto;border:2px solid var(--tx);background:linear-gradient(var(--card) 48%,var(--tx) 48% 52%,var(--ac) 52%);animation:ballin .7s ease-out both}
@keyframes ballin{0%{transform:translateY(-46px) scale(.5);opacity:0}45%{transform:none;opacity:1}65%{transform:rotate(-16deg)}85%{transform:rotate(12deg)}100%{transform:none;opacity:1}}
@keyframes revin{0%,55%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}
.cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cf i{position:absolute;top:-8px;width:6px;height:11px;opacity:0;animation:cfall 1.5s ease-in both}
@keyframes cfall{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(90px) rotate(420deg)}}
.card.mine{border:2px solid var(--ac)}
.card.hl{border-color:var(--ac);box-shadow:0 0 0 3px var(--hi);animation:flash 1s .4s both}
@keyframes flash{0%,100%{transform:none}40%{transform:scale(1.03)}}
/* 2a: maç günlüğü */
.msc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:10px 0}
.msc .ct{justify-content:center}
.sc2{font-family:var(--num);font-size:40px;min-width:40px;text-align:center}
.fm{display:inline-flex;align-items:center}
.fd{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:4px;vertical-align:-1px;flex:0 0 auto}
.row .fd{margin:0}
.fd.w{background:var(--ac)}.fd.d{background:var(--mut)}.fd.l{background:var(--wr)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:4px;background:linear-gradient(var(--hi),var(--hi2));padding:12px 6px 0;margin-top:8px;border-radius:10px 10px 0 0;border-bottom:10px solid #8b5e34;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.shelf+.shelf{margin-top:14px}
.it{text-align:center;min-width:0;padding-bottom:6px}
.it svg{width:54px;height:62px}
.it b{display:block;font-family:var(--num);font-size:16px;line-height:1.1}
.it span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.gh{opacity:.6}
.dbox.wide{max-width:min(94vw,460px);max-height:92vh;overflow:auto}
.shimg{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:10px;border:1px solid var(--bd);margin:8px 0;background:#fff}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--tx)}

.stp{flex:1;min-width:0;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;min-height:56px;cursor:pointer;position:relative}
.stp::before{content:"";position:absolute;top:17px;left:-50%;right:50%;height:2px;background:var(--bd)}
.stp.dn::before{background:var(--ac)}.stp:first-child::before{display:none}
.stp i{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--num);font-weight:700;font-size:16px}
.stp.dn i{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.stp.cu i{border-color:var(--ac);color:var(--ac)}.stp.cu{color:var(--tx);font-weight:600}
.hero{text-align:left;padding:14px}.hero .rs{font-size:28px;line-height:1.1}
.hn{color:var(--mut);margin:4px 0 12px}.hero .rs{background:none;padding:0}
.cta{width:100%;min-height:58px;font-family:var(--num);font-size:22px;letter-spacing:.02em}
.nav button{font-size:12px}
#fincard{scroll-margin-top:72px}
/* hızlı skor paneli */
.qbk{position:fixed;inset:0;z-index:19;border:0;padding:0;min-height:0;border-radius:0;background:rgba(0,0,0,.45)}.qbk.in{animation:fadein .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:720px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--card);color:var(--tx);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.3)}.sheet.in{animation:sup .22s ease-out}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--bd);margin:-4px auto 10px}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:6px}.qh .rs{flex:1;background:none;padding:0}
.sheet .mb{width:50px;height:50px;font-size:26px}.sheet .btn.p{min-height:56px;font-size:20px;font-family:var(--num)}
.sheet .sc2{min-width:34px}
@keyframes sup{from{transform:translateY(100%)}}@keyframes fadein{from{opacity:0}}
body.qo{overflow:hidden}
.fab{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--ac);color:var(--acx);font:700 20px var(--num);box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.fab[hidden]{display:none}

/* ===== 5: estetik katmanı ===== */
:root{--bg2:#ebf1ed;--gold:#d4a017;--goldx:#2b2000;--beam:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d14;--bg2:#0a121b;--card:#0f1a26;--tx:#e9f1f7;--mut:#8497a8;--ac:#3ee6a8;--acx:#04231a;--bd:#1b2b3b;--hi:#12303a;--hi2:#0c2630;--h1:#0b1622;--h2:#0e1d2c;--wr:#ff6b6b;--gold:#f0c24b;--beam:rgba(90,200,255,.16)}}
:root[data-theme="dark"]{--bg:#070d14;--bg2:#0a121b;--card:#0f1a26;--tx:#e9f1f7;--mut:#8497a8;--ac:#3ee6a8;--acx:#04231a;--bd:#1b2b3b;--hi:#12303a;--hi2:#0c2630;--h1:#0b1622;--h2:#0e1d2c;--wr:#ff6b6b;--gold:#f0c24b;--beam:rgba(90,200,255,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:radial-gradient(ellipse at 20% -70%,rgba(120,220,255,.4),transparent 62%),repeating-linear-gradient(90deg,var(--h1) 0 30px,var(--h2) 30px 60px)}}
:root[data-theme="dark"] header{background:radial-gradient(ellipse at 20% -70%,rgba(120,220,255,.4),transparent 62%),repeating-linear-gradient(90deg,var(--h1) 0 30px,var(--h2) 30px 60px)}
body{background:radial-gradient(ellipse 95% 340px at 50% -80px,var(--beam),transparent) no-repeat,repeating-linear-gradient(90deg,var(--bg) 0 44px,var(--bg2) 44px 88px)}
/* hiyerarşi: listeler kutusuz, sadece ana kartlar kutulu */
.card{background:transparent;border:0;border-top:2px solid var(--bd);border-radius:0;padding:12px 2px}
.grid>.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.grid>.card.mine{border:2px solid var(--gold)}.grid>.card.dead{border:2px solid var(--wr)}
.card h3{font-size:22px}
.big{border-radius:16px}
.hero{border:1px solid var(--bd)}
.hero.gold{background:linear-gradient(150deg,#fbeaa8,#e0b43a);color:#2b2000}.hero.gold .hn{color:#4a3600}
/* başlık */
header{padding:6px 12px 10px}
h1{display:flex;align-items:center;gap:8px;font-size:23px}
h1 svg{width:24px;height:24px;flex:0 0 auto}
h1 img{width:30px;height:30px;flex:0 0 auto;border-radius:8px;box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
header .sel{min-height:40px;background:rgba(255,255,255,.16);color:#fff;border:0;font-weight:600;max-width:150px}
header .sel option{color:#000}
header .btn{min-height:40px;width:40px;padding:0;background:rgba(255,255,255,.16);color:#fff;border:0;font-size:20px}
.dock{top:calc(env(safe-area-inset-top,0px) + 58px)}
/* sayılar */
.sc2{font-size:64px;line-height:1}.ovr b{font-size:64px}.hero .rs{font-size:32px}
.msc .crest.sm{width:36px;height:40px;font-size:14px;margin:0 auto 2px;padding-bottom:5px}
/* grup gücü çubuğu */
.gb{display:block;height:5px;border-radius:3px;background:var(--bd);margin:0 0 6px;overflow:hidden}
.gb u{display:block;height:100%;background:var(--ac);text-decoration:none}
.card.dead .gb u{background:var(--wr)}.card.mine .gb u{background:var(--gold)}
/* altın vurgu */
.fab,.sheet .btn.p[data-a="msave"]{background:linear-gradient(135deg,#f8e08a,#d4a017);color:#2b2000}
/* boş ekran */
.emp{text-align:center;color:var(--mut);padding:14px 0}.emp svg{width:96px;height:64px;display:block;margin:0 auto 6px;fill:none;stroke:currentColor;stroke-width:1.5;opacity:.7}
/* dokunma geri bildirimi */
button{transition:transform .08s}button:active{transform:scale(.96)}
/* ===== 6: yeni özellikler ===== */
.ach{padding:8px 0;border-top:1px solid var(--bd)}.ach:first-of-type{border-top:0}.ach:not(.un) .n{color:var(--mut)}.ach .ok{color:var(--ac)}.ach .bk{margin-top:6px}
.dif{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}.dif .stars{letter-spacing:2px;font-size:16px}
.dl{flex:0 0 auto;display:flex;gap:8px;font-family:var(--num);font-size:14px}
.reel{display:grid;gap:6px;margin:12px 0}.rl{display:flex;align-items:center;min-height:46px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;opacity:.4;overflow:hidden}
.rl.on{opacity:1;min-height:64px;border:2px solid var(--ac);background:var(--hi);font-family:var(--num);font-size:24px}
.rl.win{border-color:var(--gold);box-shadow:0 0 0 3px var(--hi);animation:flash .9s both}
.rc{display:flex;align-items:center;gap:8px;width:100%;min-width:0;animation:rollin .12s ease-out}
.rc .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes rollin{from{transform:translateY(-16px);opacity:.2}to{transform:none;opacity:1}}
/* ===== 7: oyuncu kartı, armalar, hareket ===== */
.tcw{--shp:polygon(9% 0,91% 0,100% 5%,100% 84%,50% 100%,0 84%,0 5%);--rx:0deg;--ry:0deg;width:min(100%,284px);margin:4px auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.32));transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s ease-out;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tcw .tc{position:relative;aspect-ratio:.74;padding:0;margin:0;border:0;border-radius:0;overflow:visible;clip-path:var(--shp)}
.tcw .tc::before{display:none}
.tcw .tc.t0{background:#9fb5a8;color:#12211a}.tcw .tc.t1{background:#b8860b;color:#2b2000}.tcw .tc.t2{background:#8a96a0;color:#1b2328}.tcw .tc.t3{background:#94602f;color:#2a1500}
.tcw .tc>.tcin{position:absolute;inset:4px;clip-path:var(--shp);display:flex;flex-direction:column;align-items:center;padding:18px 14px 13%;overflow:hidden}
.tcw .t0>.tcin{background:linear-gradient(160deg,#fff,#e4efe8)}
.tcw .t1>.tcin{background:linear-gradient(160deg,#fbeaa8,#e6bd48 55%,#c99a1c)}
.tcw .t2>.tcin{background:linear-gradient(160deg,#f6f8fa,#c3ccd3 55%,#9fabb5)}
.tcw .t3>.tcin{background:linear-gradient(160deg,#f5d3ae,#cb8c52 55%,#a86d3a)}
.tcin::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 40px,rgba(0,0,0,.08) 41px,rgba(0,0,0,.08) 43px,transparent 44px),linear-gradient(0deg,transparent calc(46% - 1px),rgba(0,0,0,.06) calc(46% - 1px),rgba(0,0,0,.06) calc(46% + 1px),transparent calc(46% + 1px))}
.tcin>*{position:relative}
.tcin>.foil,.tcin>.gl{position:absolute;inset:0;pointer-events:none}
.foil{background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);background-size:250% 100%;background-position:130% 0;mix-blend-mode:overlay;animation:foilp 6s ease-in-out infinite}
@keyframes foilp{0%,55%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}
.gl{background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.5),transparent 55%);opacity:0;transition:opacity .2s;mix-blend-mode:soft-light}
.tcw.on .gl{opacity:1}
.tt{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px}
.tt .ovr{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:.9;min-width:0}
.tcw .ovr b{font-size:58px}.tt .ovr span{font-size:12px;letter-spacing:.1em}.tt .ovr .fg{width:32px;height:21px;margin-top:8px;vertical-align:0}
.bd{display:block;flex:0 0 auto}
.tcw .tcn{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1;text-transform:uppercase;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px;letter-spacing:.02em}
.tcw .tcc{font-size:12px;opacity:.8;margin:1px 0 7px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-top:2px solid rgba(0,0,0,.18);padding-top:8px;text-align:center}
.st3 b{display:block;font-family:var(--num);font-size:28px;line-height:1}
.st3 span{font-size:12px;letter-spacing:.1em;opacity:.75}
.st3 div+div{border-left:1px solid rgba(0,0,0,.15)}
.tcw .dif{margin-top:6px;font-size:12px}.tcw .dif .stars{font-size:14px}
.tcap{text-align:center;color:var(--mut);font-size:12px;margin:2px 0 12px}
.row .bd{margin-right:2px}
/* hareket */
#app.sw>*{animation:rise .38s ease-out both}
#app.sw>*:nth-child(2){animation-delay:.05s}#app.sw>*:nth-child(3){animation-delay:.1s}#app.sw>*:nth-child(4){animation-delay:.15s}#app.sw>*:nth-child(5){animation-delay:.2s}#app.sw>*:nth-child(6){animation-delay:.25s}#app.sw>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.hero.gold{position:relative;overflow:hidden}
.hero.gold::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.4s ease-in-out 1 both}
.cfx{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.cfx i{position:absolute;top:-16px;height:14px;opacity:0;animation:cfx 2.4s ease-in both}
@keyframes cfx{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{animation:none!important;transition:none!important}
.orow{border-top:1px solid var(--bd)}.orow:first-child{border-top:0}
.ob{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;min-height:48px;gap:6px;cursor:pointer}
.ob .rk{flex:0 0 20px;text-align:center;font-family:var(--num);color:var(--mut)}
.ob .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob .oc{flex:0 0 auto;font-size:12px;color:var(--mut)}.ob .oc b{font-size:15px;color:var(--tx)}
.gbm{flex:0 0 auto;display:flex;gap:3px}
.gbm i{font-style:normal;font-family:var(--num);font-size:12px;padding:2px 5px;border-radius:5px;color:#fff;min-width:24px;text-align:center}
.gbm i.w{background:var(--ac)}.gbm i.d{background:var(--mut)}.gbm i.l{background:var(--wr)}
.odt{padding:0 0 8px 26px}.odt .row{min-height:34px}
.hn{flex-wrap:nowrap;gap:4px}.hn .chip{padding:6px 2px;font-size:13px;min-width:0;white-space:nowrap}

.mtl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 10px}.mtl.c2{grid-template-columns:repeat(2,1fr)}
.mtl>div{background:var(--hi);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.mtl b{display:block;font-family:var(--num);font-size:26px;line-height:1.1}
.mtl span{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.mtl small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.msb{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden}.msb i{display:block;height:100%}
.msb .w,.mbr .w,.mfc i.w{background:var(--ac)}.msb .d,.mbr .d,.mfc i.d{background:var(--mut)}.msb .l,.mbr .l,.mfc i.l{background:var(--wr)}
.mgl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-top:5px}.mgl .w{color:var(--ac)}.mgl .d{color:var(--mut)}.mgl .l{color:var(--wr)}
.mfr{display:flex;gap:4px;margin-top:2px}.mfc{flex:1;min-width:0;text-align:center}
.mfc i{font-style:normal;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:32px;margin:0 auto;border-radius:50%;font-size:12px;font-weight:700;color:#fff}
.mfc span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.mstg{padding:8px 0;border-top:1px solid var(--bd)}.mstg:first-of-type{border-top:0}
.mstt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.stk{display:inline-block;margin:0 0 8px;padding:3px 10px;border-radius:99px;background:rgba(127,127,127,.2);font-size:13px;font-weight:600}
.mrec{color:var(--mut);font-size:13px;text-align:center}

.sgl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.gcd{font:inherit;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:5px}
.gcd.gold{background:linear-gradient(150deg,#fbeaa8,#e0b43a);color:#2b2000;border:2px solid #b8891a}
.gcd .gt{display:flex;align-items:center;gap:6px;min-width:0}.gcd .gt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.gcd .gs{font-size:12px;opacity:.75}.gcd .gr{font-weight:700;font-size:13px}
.spt{display:block;width:100%;height:auto}
.spt .ln{stroke:var(--ac);stroke-width:2.5}.spt .lm{stroke:var(--bd);stroke-width:2;stroke-dasharray:3 3}
.spt .dn{fill:var(--ac)}.spt .dn.el{fill:var(--wr)}.spt .em{fill:var(--card);stroke:var(--bd);stroke-width:1.5}
.spt .ln.ch{stroke:#b8891a}.spt .dn.ch{fill:#b8891a}.spt text{fill:var(--mut);font-size:9px}
.gold .spt .ln.ch{stroke:#6b4a00}.gold .spt .dn.ch{fill:#6b4a00}.gold .spt text{fill:#4a3600}
.sfb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.xpr{padding:8px 0;border-top:1px solid var(--bd)}.xpr:first-of-type{border-top:0}
.xpt{display:flex;justify-content:space-between;align-items:center;gap:8px}.xpt b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpd{font-family:var(--num);font-weight:700;font-size:15px;padding:2px 9px;border-radius:99px;color:#fff;flex:0 0 auto}
.xpd.p{background:var(--ac);color:var(--acx)}.xpd.n{background:var(--wr)}.xpd.z{background:var(--mut)}
.xps{font-size:12px;color:var(--mut);margin-top:2px}
.scp text{fill:var(--mut);font-size:9px}.scp .gl{stroke:var(--bd)}.scp .p{fill:var(--ac)}.scp .n{fill:var(--wr)}.scp .z{fill:var(--mut)}
</style>

function genDraw(s,tries,tight,ms){ms=ms||900;const t0=Date.now();
  const c=s.cfg,P=s.P,z=gsz(c),G=P.length/z,gc=s.rl.gcap||99,pot=s.rl.dm!="rnd";
  const base=pot?P.slice().sort((x,y)=>V(T[y])-V(T[x])):null;
  const tg=.55*Math.sqrt(8/z)*tight,ta=1.3*Math.sqrt(8/z)*tight;
  let best=null,bs=1e9;
  for(let tr=0;tr<tries&&(tr==0||Date.now()-t0<ms);tr++){
    const src=pot?base:sh(P),pots=[];
    for(let k=0;k<z;k++)pots.push(src.slice(k*G,k*G+G));
    const GR=rg(G).map(()=>[]),seq=[];let ok=true;
    for(const pt of pots){
      const ts=sh(pt),used=new Set(),res=[];let nodes=0;
      const dfs=k=>{if(k==ts.length)return true;if(++nodes>8000)return false;
        for(const g of sh(rg(G))){
          if(used.has(g)||GR[g].filter(i=>T[i].c==T[ts[k]].c).length>=gc)continue;
          used.add(g);res.push([ts[k],g]);GR[g].push(ts[k]);
          if(dfs(k+1))return true;
          used.delete(g);res.pop();GR[g].pop()}
        return false};
      if(!dfs(0)){ok=false;break}
      seq.push(...res)}
    if(!ok)continue;
    const gs=GR.map(g=>avg(g,"g")),as=GR.map(g=>avg(g,"a")),a=Math.max(...gs)-Math.min(...gs),b=Math.max(...as)-Math.min(...as),sc=a+b*.4;
    if(sc<bs){bs=sc;best={G:GR,seq}}
    if(!pot||(a<=tg&&b<=ta))break}
  return best}

function vitrinCard(){

function histView(){
  const ss=store.seasons.slice().reverse(),fin=ss.filter(x=>x.res),n=fin.length;
  const cnt=SN.map((_,i)=>fin.filter(x=>x.res.st==i).length),mx=Math.max(1,...cnt);
  const gp=fin.filter(x=>x.res.st==0&&x.res.pts!=null).map(x=>x.res.pts);
  const best=n?Math.max(...fin.map(x=>x.res.st)):-1;
  const P={};ss.forEach(x=>x.pl.forEach(p=>{const k=p.n.toLowerCase(),o=P[k]=P[k]||{n:p.n,g:0,a:0};o.g+=p.g;o.a+=p.a}));
  const pl=Object.values(P);
  const top=f=>pl.filter(p=>p[f]>0).sort((a,b)=>b[f]-a[f]).slice(0,5).map((p,i)=>`<div class="row"><span class="lb" style="width:18px">${i+1}</span><span class="n">${esc(p.n)}</span><span class="g">${p[f]}</span></div>`).join("")||`<div class="note">Veri yok</div>`;
  const TM={};fin.forEach(x=>{if(x.my==null)return;const o=TM[x.my]=TM[x.my]||{n:T[x.my].n,k:0,b:0};o.k++;o.b=Math.max(o.b,x.res.st)});
  const card=(t,b)=>`<div class="card" style="margin-top:10px"><h3>${t}</h3>${b}</div>`;
  const R=(a,b)=>`<div class="row"><span class="n">${a}</span><b>${b}</b></div>`;

  const A2=card("Sonuç dağılımı",SN.map((x,i)=>i).filter(i=>i==0||i>=3||cnt[i]>0).map(i=>`<div class="row"><span class="n" style="flex:0 0 150px">${SN[i]}</span><div class="bk"><i style="width:${cnt[i]/mx*100}%"></i></div><b>${cnt[i]}</b></div>`).join(""));
  const A3=(gp.length?card("Grupta elenme puanları",R("Ortalama",fx(gp.reduce((a,b)=>a+b,0)/gp.length))+R("En düşük / en yüksek",Math.min(...gp)+" / "+Math.max(...gp))):"");

  const A6c=x=>`<div class="card" style="margin-top:6px"><h3>${esc(x.name)}${x.id==store.cur?" •":""}<small>${x.date}</small></h3><div>${x.my!=null?"★ "+T[x.my].n+" ("+cn(T[x.my].c)+")":"Takım seçilmedi"}</div><div class="rs">${x.res?rlb(x.res):"Devam ediyor"}</div>${pathSvg(x)}<div class="note" style="margin-top:2px">${fmt(x.cfg)}</div>${x.pl.length?`<div class="note">${sum(x.pl,"g")} gol · ${sum(x.pl,"a")} asist</div>`:""}${x.res&&x.res.note?`<div class="note">${esc(x.res.note)}</div>`:""}<div class="bar"><button class="btn" data-a="open" data-id="${x.id}">Aç</button><button class="btn" data-a="sum" data-id="${x.id}">Özet</button><button class="btn" data-a="karne" data-id="${x.id}">Karne</button><button class="btn" data-a="ren" data-id="${x.id}">Adı değiştir</button><button class="btn" data-a="del" data-id="${x.id}">Sil</button></div></div>`;
  const ht=st.ht||"o",nav=`<div class="bar hn" style="margin:12px 0 0">${[["o","Özet"],["r","Rekorlar"],["b","Rozetler"],["s","Sezonlar"],["p","Rakipler"],["m","Maçlar"]].map(([k,l])=>`<button class="chip ${ht==k?"on":""}" data-a="ht" data-v="${k}" style="flex:1">${l}</button>`).join("")}</div>`;
  const body=ht=="r"?recCard()+A4+A5+cmpCard():ht=="b"?achCard():ht=="s"?seasonsView(ss,A6c):ht=="p"?oppCard():ht=="m"?matchTab():careerCard()+xpCard()+powerCard()+A1+A2+A3+tsCard()+chartCard();

const bsp={};
function bspec(i){const n=T[i].n;if(bsp[n])return bsp[n];
  let x=2166136261;for(const ch of n)x=Math.imul(x^ch.charCodeAt(0),16777619)>>>0;
  const h=x%360,h2=(h+[30,60,150,180,210][(x>>>9)%5])%360,li=(x>>>5)&1;
  const ini=n.split(/[\s.\-']+/).filter(Boolean).map(w=>w[0]).join("").slice(0,3).toUpperCase();
  return bsp[n]={c1:`hsl(${h},55%,32%)`,c2:li?`hsl(${h2},75%,58%)`:"#f1f1ea",p:BP[(x>>>13)%6],ini}}
let bid=0;
function badge(i,w){const b=bspec(i),id="bc"+(++bid),fs=b.ini.length>2?14:b.ini.length==2?17:21;
  return `<svg class="bd" viewBox="0 0 46 53" width="${w}" height="${Math.round(w*53/46)}" ${w<40?'aria-hidden="true"':`role="img" aria-label="${esc(T[i].n)} arması"`}><defs><clipPath id="${id}"><path d="${SHD}"/></clipPath></defs><g clip-path="url(#${id})"><rect width="46" height="53" fill="${b.c1}"/><path d="${b.p}" fill="${b.c2}"/></g><path d="${SHD}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2"/><text x="23" y="29" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="700" fill="#fff" style="font-family:var(--num);paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2.6px;stroke-linejoin:round">${esc(b.ini)}</text></svg>`}
function drawBadge(c,i,x,y,w){const b=bspec(i),k=w/46,fs=b.ini.length>2?14:b.ini.length==2?17:21,sh=new Path2D(SHD);
  c.save();c.translate(x,y);c.scale(k,k);
  c.save();c.clip(sh);c.fillStyle=b.c1;c.fillRect(0,0,46,53);c.fillStyle=b.c2;c.fill(new Path2D(b.p));c.restore();
  c.lineWidth=2;c.strokeStyle="rgba(255,255,255,.9)";c.stroke(sh);
  c.font="700 "+fs+"px "+NUMF;c.textAlign="center";c.textBaseline="middle";c.lineJoin="round";c.lineWidth=2.6;c.strokeStyle="rgba(0,0,0,.55)";c.strokeText(b.ini,23,29);c.fillStyle="#fff";c.fillText(b.ini,23,29);

  else if(a=="rcv"){if(RCV.some(x=>x[0]==dk)){st.bk=rcvGet(dk)||"";st.bkadv=true}}
  else if(a=="rcvx"){ask("Bu kayıt kalıcı olarak silinsin mi?",()=>{try{localStorage.removeItem(dk)}catch(e){}});render();return}
  else if(a=="rst"){ask("Tüm sezonlar, maçlar ve ayarlar silinecek. Önce yedek almanı öneririm. Devam edilsin mi?",()=>resetAll());render();return}
  else if(a=="sum")st.sum=id;
  else return;
  save();render();flush(un,snap);if(st.cel){st.cel=0;scrollTo(0,0);confetti()}if(a=="gofin"){const e=$("fincard");if(e)e.scrollIntoView({block:"start"})}
  if(a=="next"){try{const e=document.querySelector(".card.hl");if(e&&e.scrollIntoView)e.scrollIntoView({block:"center",behavior:rm()?"auto":"smooth"})}catch(x){}}});
document.addEventListener("change",e=>{
  hideToast();
  const d=e.target.dataset,v=e.target.value;
  if(d.rs){cur().rl[d.rs]=+v;save();render()}
  else if(d.ts){const s=cur(),m=msum(s);s.tb=s.tb||{};s.tb[d.ts]=Math.max(0,parseInt(v)||0)-m[d.ts];reTs(s);save();render()}
  else if(d.pr){cur().pl[+d.i].r=parseFloat(v.replace(",","."))||0;save();render()}
  else if(e.target.id=="df"){store.diff=+v;save();render()}
  else if(e.target.id=="sft"){st.sft=v;render()}
  else if(e.target.id=="sfc"){st.sfc=v;render()}
  else if(e.target.id=="ca"){st.ca=+v;render()}
  else if(e.target.id=="cb"){st.cb=+v;render()}
  else if(e.target.id=="ss"){store.cur=+e.target.value;sync();st.mode=null;save();render()}
  else if(e.target.id=="mt"){if(tmLock(cur())||st.dr)return;if(e.target.value!==""){cur().my=+e.target.value;st.mode="man";save();render()}}
  else if(e.target.id=="mop"){st.mop=+v;st.mlg=null;render()}
  else if(e.target.id=="mrd"){st.mrd=v;st.mlg=null;render()}
  else if(e.target.id=="mlg"){st.mlg=+v;render()}
  else if(e.target.id=="imf"){const f=e.target.files&&e.target.files[0];e.target.value="";if(f)readImp(f)}
  else if(e.target.id=="stg")$("ptw").style.display=e.target.value=="0"?"block":"none";flush()});
st.tab=7;
if(location.hash=="#kura")st.tab=2;else if(location.hash=="#mac"){st.tab=7;st.qs=true}
if(DROP.length&&!loadWarn)loadWarn="Takım listesi güncellendi. Şu takımlar listede olmadığı için eski sezonlardan çıkarıldı: "+[...new Set(DROP)].join(", ")+".";DROP=[];
save();
if(loadWarn)ask(loadWarn);
render();
